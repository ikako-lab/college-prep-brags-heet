<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="fuzz" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="3.5"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400"><feGaussianBlur stdDeviation="10"/></filter>
    <radialGradient id="shade" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#C9C4BC"/><stop offset=".7" stop-color="#A8A39B"/><stop offset="1" stop-color="#8D8880"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#CFE3FF"/>
      <stop offset=".7" stop-color="#8DB3F7"/><stop offset="1" stop-color="#B9A6F0"/>
    </radialGradient>
    <radialGradient id="face" cx="45%" cy="35%" r="75%">
      <stop offset="0" stop-color="#F7F3EC"/><stop offset="1" stop-color="#EAE3D8"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="380" rx="110" ry="10" fill="#000" opacity=".06"/>
  <g filter="url(#fuzz)">
    <!-- tail -->
    <g transform="rotate(-28 300 300)">
      <rect x="276" y="238" width="44" height="120" rx="22" fill="#A8A39B"/>
      <rect x="276" y="262" width="44" height="16" fill="#5E5A55"/>
      <rect x="276" y="294" width="44" height="16" fill="#5E5A55"/>
      <path d="M276 326h44v10a22 22 0 0 1-44 0z" fill="#5E5A55"/>
    </g>
    <!-- ears -->
    <path d="M132 112L136 40Q140 30 150 36L196 66Z" fill="#A8A39B" stroke="#A8A39B" stroke-width="14" stroke-linejoin="round"/>
    <path d="M268 112L264 40Q260 30 250 36L204 66Z" fill="#A8A39B" stroke="#A8A39B" stroke-width="14" stroke-linejoin="round"/>
    <path d="M146 92L148 54L176 72Z" fill="#E9C7C9" opacity=".8"/>
    <path d="M254 92L252 54L224 72Z" fill="#E9C7C9" opacity=".8"/>
    <path d="M118 156C118 84 158 44 200 44S282 84 282 156L288 296C290 348 252 366 200 366S110 348 112 296Z" fill="url(#shade)"/>
    <ellipse cx="162" cy="364" rx="30" ry="14" fill="#A8A39B"/>
    <ellipse cx="238" cy="364" rx="30" ry="14" fill="#A8A39B"/>
  </g>
  <!-- face window -->
  <rect x="146" y="88" width="108" height="94" rx="46" fill="url(#face)"/>
  <!-- soft mask -->
  <path d="M150 128C156 110 184 110 194 124Q200 132 206 124C216 110 244 110 250 128C254 142 236 150 222 146Q200 140 178 146C164 150 146 142 150 128Z" fill="#6A665F" opacity=".85"/>
  <circle cx="178" cy="130" r="5" fill="#1F1E22"/><circle cx="222" cy="130" r="5" fill="#1F1E22"/>
  <circle cx="179.5" cy="128.5" r="1.6" fill="#fff"/><circle cx="223.5" cy="128.5" r="1.6" fill="#fff"/>
  <ellipse cx="200" cy="154" rx="5" ry="3.5" fill="#1F1E22"/>
  <path d="M193 162q7 6 14 0" stroke="#1F1E22" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="164" cy="158" rx="9" ry="5" fill="#F2B8C2" opacity=".55"/>
  <ellipse cx="236" cy="158" rx="9" ry="5" fill="#F2B8C2" opacity=".55"/>
  <!-- glowing memory orb -->
  <circle cx="200" cy="258" r="38" fill="#9CC1FF" opacity=".55" filter="url(#glow)"/>
  <circle cx="200" cy="258" r="32" fill="url(#orb)"/>
  <ellipse cx="200" cy="262" rx="20" ry="6" fill="none" stroke="#fff" stroke-width="2.5" opacity=".75" transform="rotate(-18 200 262)"/>
  <ellipse cx="190" cy="246" rx="8" ry="5" fill="#fff" opacity=".8"/>
  <!-- stubby arms -->
  <g filter="url(#fuzz)">
    <path d="M128 210C126 244 140 266 166 266" stroke="#A8A39B" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M272 210C274 244 260 266 234 266" stroke="#A8A39B" stroke-width="30" fill="none" stroke-linecap="round"/>
  </g>
</svg>
